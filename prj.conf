# Zephyr feature switches to turn components on and off
# GPIO is still needed by the board support layer
CONFIG_GPIO=y

# Enable logging and sensor support
CONFIG_LOG=y
CONFIG_SENSOR=y

# Enable the PWM driver so LEDs can be dimmed via duty-cycle control
CONFIG_PWM=y

# Enable C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Enable bluetooth support
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO_TEMP"
# Enable RTT logging (no UART on XIAO BLE USB)
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n