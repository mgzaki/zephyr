# Zephyr feature switches to turn components on and off
# GPIO is still needed by the board support layer
CONFIG_GPIO=y

# Enable logging and sensor support
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SENSOR=y

# Enable the PWM driver so LEDs can be dimmed via duty-cycle control
CONFIG_PWM=y

# Enable C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Enable bluetooth support
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO_TEMP"

# Enable RTT logging (no UART on XIAO BLE USB)
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# --- I2C and External Sensors ---
CONFIG_I2C=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_NONE=y
CONFIG_LSM6DSL_ACCEL_ODR=2

# --- Power Management ---
# Turn on the core Power Management subsystem
CONFIG_PM=y

# Allow us to selectively turn off specific hardware (like the IMU/I2C)
CONFIG_PM_DEVICE=y

# Automatically turn off the main system clock when threads sleep
CONFIG_PM_DEVICE_RUNTIME=y