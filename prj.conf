# Zephyr feature switches for HaykulFinder
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SENSOR=y

# Enable the PWM driver for the Piezo Buzzer
CONFIG_PWM=y

# Enable C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Enable Bluetooth support
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HaykulTracker"
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Enable RTT logging
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# --- I2C for BMA400 Accelerometer ---
# Schematic: CSB=VDD selects I2C mode, SDO=GND selects addr 0x14
# Note: Zephyr has no native BMA400 driver; using raw I2C in imu_bma400.cpp
CONFIG_I2C=y

# --- Power Management ---
# Note: CONFIG_PM requires HAS_PM which depends on SYS_CLOCK_EXISTS
# Removed PM configs that aren't supported on this SoC/board combo

# --- NFC T2T for OOB Pairing ---
CONFIG_NFC_T2T_NRFXLIB=y
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_LE_OOB_REC=y
CONFIG_NFC_NDEF_AAR_REC=y

# Battery Service
CONFIG_BT_BAS=y

# --- ADC for battery level (SAADC VDDHDIV5) ---
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# --- Work queues / timers for button + LED ---
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048